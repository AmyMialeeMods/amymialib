plugins {
    id 'net.fabricmc.fabric-loom' version "+"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

repositories {
    maven { url "https://maven.uuid.gg/releases" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:+"
    implementation "net.fabricmc.fabric-api:fabric-api:+"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation include ("org.javassist:javassist:+")
    implementation include ("org.reflections:reflections:+")
    implementation include ("org.apache.commons:commons-text:+")
    implementation include ("org.apache.commons:commons-collections4:+")
    implementation include ("dev.upcraft.datasync:${project.datasync_version}")
}

publishMods {
    file = jar.archiveFile
    displayName = "${project.version.toString().split("\\+")[0]} for Fabric $minecraft_version"
    changelog = ""
    type = STABLE
    modLoaders.addAll("fabric", "quilt")
    dryRun = !providers.gradleProperty("modrinth_api_key").isPresent()
    modrinth {
        accessToken = providers.gradleProperty("modrinth_api_key")
        projectId = modrinth_id
        minecraftVersionRange {
            start = minecraft_version
            end = minecraft_version
            includeSnapshots = true
        }
        announcementTitle = "Download from Modrinth"
    }
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.mod_id + "-" + project.minecraft_version }

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    //noinspection GroovyAssignabilityCheck, GrUnresolvedAccess
    it.options.release.set(getProject().java_version.toInteger())
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
    withSourcesJar()
}

loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.classtweaker")
}

configurations.configureEach { resolutionStrategy { componentSelection {
    withModule('net.fabricmc.fabric-api:fabric-api') { ComponentSelection selection ->
        if (!selection.candidate.version.endsWith('+' + project.minecraft_version)) {
            selection.reject("Version ${selection.candidate.version} does not end with +${project.minecraft_version}")
        }
    }
}}}

fabricApi {
    configureDataGeneration {
        modId = project.mod_id
        client = true
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

jar {
    from("LICENSE.md") { rename { "${it}_${project.mod_id}" } }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }
    repositories {
        maven {
            name = "willBlRepositoryReleases"
            url = "https://maven.willbl.dev/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}